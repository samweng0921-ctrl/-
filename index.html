<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸運輪盤抽獎系統</title>
  <!-- Inline SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%237C5CFF'/%3E%3Cpath d='M50 15 L65 45 L35 45 Z' fill='%2322D3EE'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #121212;
      --surface: #1B1B20;
      --surface-2: #232329;
      --text: #E0E0E0;
      --muted: #9A9AA5;
      --border: rgba(224, 224, 224, 0.10);
      --accent: #7C5CFF;
      --accent-2: #22D3EE;
      --danger: #FF5C7A;
      
      --grad-primary: linear-gradient(135deg, #7C5CFF, #22D3EE);
      --shadow-glow: 0 0 40px rgba(124, 92, 255, 0.35);
      --shadow-card: 0 18px 40px -18px rgba(0, 0, 0, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* RWD Grid Layout */
    .app-container {
      display: grid;
      grid-template-columns: 380px 1fr;
      min-height: 100vh;
      width: 100%;
    }

    /* Left Control Panel */
    .control-panel {
      background-color: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      box-shadow: 10px 0 30px rgba(0,0,0,0.3);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .panel-header h1 {
      font-size: 20px;
      font-weight: 700;
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .icon-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .label-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    .badge {
      background: var(--accent);
      color: #fff;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }

    textarea {
      background-color: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
      resize: none;
      height: 140px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus-visible {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.2);
    }

    textarea.error-shake {
      border-color: var(--danger);
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .primary-btn {
      background: var(--grad-primary);
      color: #121212;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: var(--shadow-glow);
    }

    .primary-btn:hover { opacity: 0.9; }
    .primary-btn:active { transform: scale(0.98); }

    .toast {
      background-color: rgba(255, 92, 122, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .info-tips {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      background: var(--surface-2);
      padding: 12px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    /* Right Main Stage */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      background: radial-gradient(circle at center, #1e1e24 0%, var(--bg) 70%);
    }

    .wheel-container {
      position: relative;
      width: 100%;
      max-width: 620px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      max-width: 620px;
      max-height: 620px;
    }

    .spin-btn {
      margin-top: 30px;
      background: var(--grad-primary);
      color: #121212;
      border: none;
      border-radius: 50px;
      padding: 14px 48px;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      min-height: 48px;
      box-shadow: var(--shadow-glow);
      transition: all 0.3s ease;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 50px rgba(124,92,255,0.6);
    }

    .spin-btn:disabled {
      background: var(--surface-2);
      color: var(--muted);
      border: 1px solid var(--border);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--surface);
      border: 2px solid transparent;
      background-image: linear-gradient(var(--surface), var(--surface)), var(--grad-primary);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      border-radius: 16px;
      width: 90%;
      max-width: 480px;
      padding: 32px;
      text-align: center;
      box-shadow: var(--shadow-card);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    /* CSS Celebration Ray Effect */
    .modal-card::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.03) 0deg 15deg, transparent 15deg 30deg);
      top: -50%; left: -50%;
      z-index: 0;
      animation: rotateRay 20s linear infinite;
      pointer-events: none;
    }

    @keyframes rotateRay {
      100% { transform: rotate(360deg); }
    }

    .modal-content {
      position: relative;
      z-index: 1;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal-winner {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      margin: 12px 0;
      text-shadow: 0 0 20px rgba(34,211,238,0.6);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .modal-btn {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
      transition: all 0.2s;
    }

    .modal-btn-confirm {
      background: var(--grad-primary);
      color: #121212;
    }
    .modal-btn-confirm:hover { opacity: 0.9; }

    .modal-btn-cancel {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .modal-btn-cancel:hover { background: #2d2d35; }

    /* RWD Mobile Breakpoint */
    @media (max-width: 979px) {
      .app-container {
        grid-template-columns: 1fr;
        grid-template-areas: 
          "stage"
          "panel";
      }
      .stage {
        grid-area: stage;
        padding: 20px;
        border-bottom: 1px solid var(--border);
      }
      .control-panel {
        grid-area: panel;
        border-right: none;
        box-shadow: none;
      }
      canvas {
        max-width: 85vw;
        max-height: 85vw;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 控制面板 -->
    <div class="control-panel">
      <div class="panel-header">
        <h1>幸運輪盤控制台</h1>
        <button id="audioToggle" class="icon-btn" aria-label="切換音效">
          <!-- Sound On SVG (Default) -->
          <svg id="soundOnIcon" xmlns="http://w3.org" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 9 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          <!-- Sound Off SVG (Hidden) -->
